name: Tests

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'code/**'
      - '.github/workflows/tests.yml'

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code only
      uses: actions/checkout@v4
      with:
        sparse-checkout: code

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: code/requirements.txt

    - name: Install dependencies
      run: |
        pip install -r code/requirements.txt pytest

    - name: Run tests
      run: |
        python -m pytest code -q
